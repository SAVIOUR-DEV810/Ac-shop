<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC Shop | CEO password</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(12, 20, 31, 0.92);
        --text: #eef6ff;
        --muted: #9bb3c8;
        --primary: #8b5cf6;
        --primary-2: #22d3ee;
        --border: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, rgba(139,92,246,0.2), transparent 30%), var(--bg);
        color: var(--text);
      }

      .panel {
        width: min(440px, calc(100vw - 28px));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 30px 24px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.7;
      }

      label {
        display: block;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        font-size: 1rem;
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #ffb3b3;
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="brand"><span class="mark">A</span> AC Shop</div>
      <h1>CEO access</h1>
      <p>Enter the CEO password to open the private dashboard.</p>

      <label for="ceoPassword">Password</label>
      <input id="ceoPassword" type="password" placeholder="Enter password" />
      <button id="unlockBtn" type="button">Open dashboard</button>
      <div class="error" id="errorText"></div>
    </div>

    <script>
      const CEO_PASSWORD = 'buzifrank';
      const redirectTarget = sessionStorage.getItem('acShopCeoRedirect') || 'website.html';
      const passwordInput = document.getElementById('ceoPassword');
      const unlockBtn = document.getElementById('unlockBtn');
      const errorText = document.getElementById('errorText');

      function unlock() {
        const value = passwordInput.value;
        if (value === CEO_PASSWORD) {
          sessionStorage.setItem('acShopCeoUnlocked', 'true');
          window.location.href = redirectTarget;
          return;
        }
        errorText.textContent = 'Incorrect CEO password.';
      }

      unlockBtn.addEventListener('click', unlock);
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });
    </script>
  </body>
</html>
