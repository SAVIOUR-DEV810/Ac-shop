<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC Shop | Download for PC</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(15, 25, 38, 0.9);
        --panel-strong: #0d1a2b;
        --text: #edf6ff;
        --muted: #9bb3c8;
        --primary: #8b5cf6;
        --primary-2: #22d3ee;
        --accent: #7cf2bf;
        --line: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 32%),
          radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.2), transparent 28%),
          var(--bg);
        color: var(--text);
      }

      .card {
        width: min(760px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        padding: 32px 28px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-size: 1.05rem;
        box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 20px;
      }

      .download-box {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-top: 24px;
      }

      .download-btn {
        display: inline-block;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        text-decoration: none;
        font-weight: 700;
        border-radius: 14px;
        padding: 16px 22px;
        box-shadow: 0 18px 35px rgba(139, 92, 246, 0.35);
      }

      .meta {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .tiny {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="brand-mark">N</span>
        <span>AC Shop</span>
      </div>

      <h1>Download AC Shop for PC</h1>
      <p>
        Get the desktop bundle for your computer and install the AC Shop app in one click.
      </p>

      <div class="download-box">
        <a class="download-btn" href="/download/ac-shop-desktop.zip" download="ac-shop-desktop.zip">Windows</a>
        <a class="download-btn" href="/download/ac-shop-mac.dmg" download="ac-shop-mac.dmg">Mac</a>
        <a class="download-btn" href="/download/ac-shop-android.apk" download="ac-shop-android.apk">Android</a>
        <a class="download-btn" href="/download/ac-shop-ios.ipa" download="ac-shop-ios.ipa">iPhone</a>
      </div>

      <p class="tiny">Choose your device to download the AC Shop app package.</p>
    </div>
  </body>
</html>
