<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC Shop | People</title>
    <link rel="stylesheet" href="website.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #07111f;
        color: white;
      }
      .box {
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(10,18,30,0.8);
      }
      th, td {
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 12px 10px;
        text-align: left;
      }
      th { background: rgba(139,92,246,0.12); }
      .badge {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        background: rgba(45,212,191,0.12);
        color: #a5f3d0;
      }
      .muted { color: #9bb3c8; }
    </style>
  </head>
  <body>
    <script>
      const CEO_PASSWORD = 'buzifrank';
      const ceoUnlocked = sessionStorage.getItem('acShopCeoUnlocked') === 'true';

      if (!ceoUnlocked) {
        sessionStorage.setItem('acShopCeoRedirect', 'ceo-people.html');
        window.location.href = 'ceo-password.html';
      }
    </script>
    <div class="box">
      <h1>AC Shop registered people</h1>
      <p class="muted">Auto-refreshing list of everyone who registered.</p>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Country</th>
            <th>Postal</th>
            <th>Verified</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="peopleBody"></tbody>
      </table>
    </div>

    <script>
      const token = localStorage.getItem('acShopToken');
      const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3000' : '';

      async function loadPeople() {
        try {
          const res = await fetch(`${API_BASE}/api/ceo/users`, {
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Unauthorized');

          const body = document.getElementById('peopleBody');
          body.innerHTML = (data.users || []).map(user => `
            <tr>
              <td>${user.id}</td>
              <td>${user.first_name || ''} ${user.last_name || ''}</td>
              <td>${user.email}</td>
              <td>${user.phone || '—'}</td>
              <td>${user.country || '—'}</td>
              <td>${user.postal_code || '—'}</td>
              <td><span class="badge">${user.email_verified ? 'Verified' : 'Pending'}</span></td>
              <td>${new Date(user.created_at).toLocaleString()}</td>
            </tr>
          `).join('');
        } catch (error) {
          document.getElementById('peopleBody').innerHTML = `<tr><td colspan="8">${error.message}</td></tr>`;
        }
      }

      loadPeople();
      setInterval(loadPeople, 15000);
    </script>
  </body>
</html>
