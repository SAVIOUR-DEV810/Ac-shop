<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC Shop | Enrollments</title>
    <link rel="stylesheet" href="website.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #07111f;
        color: white;
      }
      .box {
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(10,18,30,0.8);
      }
      th, td {
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 12px 10px;
        text-align: left;
      }
      th { background: rgba(139,92,246,0.12); }
      .badge {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        background: rgba(251,191,36,0.12);
        color: #fcd34d;
      }
      .muted { color: #9bb3c8; }
    </style>
  </head>
  <body>
    <script>
      const CEO_PASSWORD = 'buzifrank';
      const ceoUnlocked = sessionStorage.getItem('acShopCeoUnlocked') === 'true';

      if (!ceoUnlocked) {
        sessionStorage.setItem('acShopCeoRedirect', 'ceo-enrollments.html');
        window.location.href = 'ceo-password.html';
      }
    </script>
    <div class="box">
      <h1>People who enrolled</h1>
      <p class="muted">Live list of course enrollments.</p>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Learner</th>
            <th>Professor</th>
            <th>Course</th>
            <th>Hours</th>
            <th>Total</th>
            <th>Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="enrollmentsBody"></tbody>
      </table>
    </div>

    <script>
      const token = localStorage.getItem('acShopToken');
      const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3000' : '';

      async function loadEnrollments() {
        try {
          const res = await fetch(`${API_BASE}/api/ceo/enrollments`, {
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Unauthorized');

          const body = document.getElementById('enrollmentsBody');
          body.innerHTML = (data.enrollments || []).map(item => `
            <tr>
              <td>${item.id}</td>
              <td>${item.learner_name || item.learner_email || '—'}</td>
              <td>${item.professor_email}</td>
              <td>${item.course_title}</td>
              <td>${item.hours}</td>
              <td>$${Number(item.total_amount || 0).toFixed(2)}</td>
              <td><span class="badge">${item.status || 'pending'}</span></td>
              <td>${new Date(item.created_at).toLocaleString()}</td>
            </tr>
          `).join('');
        } catch (error) {
          document.getElementById('enrollmentsBody').innerHTML = `<tr><td colspan="8">${error.message}</td></tr>`;
        }
      }

      loadEnrollments();
      setInterval(loadEnrollments, 15000);
    </script>
  </body>
</html>
